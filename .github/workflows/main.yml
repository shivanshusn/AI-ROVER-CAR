name: Build MARS-X6 Ziya Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -1)
          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_project
          INNER=$(ls extracted_project/ | head -1)
          if [ -d "extracted_project/$INNER" ] && [ "$INNER" != "app" ]; then
            cp -r extracted_project/$INNER/. .
          else
            cp -r extracted_project/. .
          fi
          ls -la
          [ -f "settings.gradle.kts" ] && echo "✅ settings.gradle.kts OK" || echo "❌ MISSING"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Setup Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Download Ziya VRM Avatar into Assets
        run: |
          mkdir -p app/src/main/assets
          curl -L \
            "https://raw.githubusercontent.com/pixiv/three-vrm/dev/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm" \
            -o app/src/main/assets/ziya_avatar.vrm \
            --retry 3 --retry-delay 5 || echo "VRM download skipped"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2g -Dfile.encoding=UTF-8"

      - name: Upload MARS-X6 Ziya Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MARS-X6-Ziya-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
