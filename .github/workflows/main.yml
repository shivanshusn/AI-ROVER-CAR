name: Build MARS-X6 Ziya Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SDK Path set to: $ANDROID_HOME"

      - name: Install Gradle & Generate Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew

      - name: Download Ziya VRM Avatar into Assets
        run: |
          mkdir -p app/src/main/assets
          curl -L \
            "https://raw.githubusercontent.com/pixiv/three-vrm/dev/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm" \
            -o app/src/main/assets/ziya_avatar.vrm \
            --retry 3 --retry-delay 5 || echo "VRM download skipped"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          GRADLE_OPTS: "-Xmx2g -Dfile.encoding=UTF-8"

      - name: Upload MARS-X6 Ziya Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MARS-X6-Ziya-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
