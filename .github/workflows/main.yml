name: Build MARS-X6 Ziya Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-Unpack ZIP if Uploaded Directly
        run: |
          if [ -f "MARS_X6_Ziya_GitHub_And_APK_Ready.zip" ]; then
            unzip -o MARS_X6_Ziya_GitHub_And_APK_Ready.zip
          fi
          mkdir -p app/src/main/assets
          if [ -f "index.html" ] && [ ! -f "app/src/main/assets/mars_x6_cockpit.html" ]; then
            cp index.html app/src/main/assets/mars_x6_cockpit.html
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Download Open Annie VRM Avatar into Assets
        run: |
          mkdir -p app/src/main/assets
          curl -L https://raw.githubusercontent.com/pixiv/three-vrm/dev/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm -o app/src/main/assets/ziya_avatar.vrm || true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Compiled MARS-X6 Ziya APK
        uses: actions/upload-artifact@v4
        with:
          name: MARS-X6-Ziya-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
